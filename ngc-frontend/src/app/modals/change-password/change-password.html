<div class="modal-header">
  <h4 class="modal-title pull-left">Cambiar Contraseña</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef.hide()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-12">
      <small class="text-secondary">Nueva Contraseña</small>
      <div class="input-group">
        <input type="{{new_credentials.show_password ? 'text': 'password'}}" name="new_password" [(ngModel)]="new_credentials.new_password" class="form-control">
        <button class="btn" [ngClass]="{'btn-light': !new_credentials.show_password, 'btn-primary': new_credentials.show_password}" (click)="toggleShowPassword()">
          <i class="fa" [ngClass]="{'fa-eye': !new_credentials.show_password, 'fa-eye-slash': new_credentials.show_password}"></i>
        </button>
      </div>
    </div>
    <div class="col-12">
      <small class="text-secondary">Confirme Contraseña</small>
      <div class="input-group">
        <input type="{{new_credentials.show_password ? 'text': 'password'}}" name="confirm_password" [(ngModel)]="new_credentials.confirm_password" class="form-control">
        <button class="btn" [ngClass]="{'btn-light': !new_credentials.show_password, 'btn-primary': new_credentials.show_password}" (click)="toggleShowPassword()">
          <i class="fa" [ngClass]="{'fa-eye': !new_credentials.show_password, 'fa-eye-slash': new_credentials.show_password}"></i>
        </button>
      </div>
    </div>
    <div class="col-12" *ngIf="new_credentials.new_password && new_credentials.confirm_password && (new_credentials.new_password !== new_credentials.confirm_password)">
      <small class="text-danger">Las contraseñas no coinciden.</small>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="modalRef.hide()">Cancelar</button>
  <button type="button" class="btn btn-primary" [disabled]="!new_credentials.new_password || !new_credentials.confirm_password || (new_credentials.new_password !== new_credentials.confirm_password)" (click)="save()">Grabar</button>
</div>
